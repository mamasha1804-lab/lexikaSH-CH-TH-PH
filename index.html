<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Остров слов</title><style>
*{box-sizing:border-box}body{margin:0;background:#123f80;color:#15335f;font-family:system-ui,sans-serif;background-image:radial-gradient(at 15% 0%,#21c9da 0,transparent 55%),radial-gradient(at 100% 80%,#6651cf 0,transparent 60%);min-height:100vh}main{max-width:980px;margin:auto;padding:24px 16px}header{color:white;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:clamp(28px,5vw,44px);margin:8px 0}p{line-height:1.6}button{font:inherit;font-weight:700;border:0;border-radius:18px;padding:15px 20px;cursor:pointer;background:#fff;color:#17416d;box-shadow:0 5px 0 #b9d5e3;transition:transform .15s}button:hover{transform:translateY(-2px)}button:focus-visible{outline:4px solid #ffbe32;outline-offset:4px}button:disabled{opacity:.6;cursor:default}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}nav button.active{background:#ffca44;box-shadow:0 5px 0 #df9626}.panel{background:#f7fcff;border-radius:28px;padding:clamp(20px,4vw,36px);box-shadow:0 12px 0 #0b306350}h2{margin-top:0;font-size:26px}.groups{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.groups button{padding:10px 16px;font-size:16px;background:#e7f0ff}.groups .active{background:#3c65cc;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card{background:white;padding:24px 18px;text-align:center;border:2px solid #d9e7fa;border-radius:24px;box-shadow:0 6px 0 #d9e7fa}.icon{font-size:65px;line-height:1.4}.word{font-size:32px;font-weight:800;margin:8px 0}.word mark{color:#b23576;background:#fff0f6;border-radius:6px}.ipa{font-size:23px;color:#56658c}.translation{font-size:21px;margin:8px 0 18px}.tip{font-size:16px;margin:14px 0 0;color:#526482}.question{text-align:center;max-width:650px;margin:auto}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.options button{background:#e6eeff;min-height:68px}.options button.good{background:#b3efbd;box-shadow:0 5px 0 #68b87c}.options button.bad{background:#ffd5d5;box-shadow:0 5px 0 #dc9999}.feedback{min-height:56px;font-size:20px;font-weight:700}.progress{height:12px;border-radius:20px;background:#dbe6fa;margin:18px 0;overflow:hidden}.progress div{height:100%;background:#ffb923}.sub{color:#d5f4ff;font-size:16px;margin:6px 0}footer{color:#d6eaff;text-align:center;font-size:14px;padding:24px}.primary{background:#ffca44;box-shadow:0 5px 0 #dfa329}.notes{background:#eaf2ff;border-radius:16px;padding:15px 20px;margin-bottom:22px;font-size:17px}small{font-size:14px}@media(max-width:500px){header{align-items:flex-start}header button{padding:12px}.options{grid-template-columns:1fr}.cards{grid-template-columns:1fr}nav button{flex:1;padding:13px 8px}.panel{padding:20px 16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><main><header><div><h1>🏝️ Остров слов</h1><p class="sub">11 слов · SH, CH, TH и PH</p></div><button id="sound" aria-label="Выключить звук">🔊 Звук</button></header><nav aria-label="Задания"><button data-mode="learn" class="active">📖 Изучай</button><button data-mode="meaning">🎯 Найди перевод</button><button data-mode="listen">🎧 Слушай</button><button data-mode="spell">🧩 Собери слово</button></nav><section class="panel" id="app"></section><footer>Учимся с Ларисой Коротаевой</footer></main><script>
const words=[
{w:'sheep',t:'ʃiːp',r:'овца',e:'🐑',g:'SH',hint:'Длинный звук [iː]. Одна овца — sheep.'},
{w:'fish',t:'fɪʃ',r:'рыба',e:'🐟',g:'SH',hint:'SH в конце слова даёт звук [ʃ].'},
{w:'ship',t:'ʃɪp',r:'корабль',e:'🚢',g:'SH',hint:'Короткий [ɪ]: ship — корабль. Сравни с sheep.'},
{w:'chick',t:'tʃɪk',r:'цыплёнок',e:'🐥',g:'CH',hint:'CH даёт звук [tʃ].'},
{w:'cheese',t:'tʃiːz',r:'сыр',e:'🧀',g:'CH',hint:'В конце слышим звонкий [z].'},
{w:'three',t:'θriː',r:'три',e:'3️⃣',g:'TH',hint:'[θ]: кончик языка между зубами, выдох без голоса.'},
{w:'thumb',t:'θʌm',r:'большой палец руки',e:'👍',g:'TH',hint:'Буква b в конце не произносится.'},
{w:'this',t:'ðɪs',r:'это, этот, эта',e:'👉',g:'TH',hint:'[ð]: кончик языка между зубами, добавь голос. This is a fish — Это рыба.'},
{w:'photo',t:'ˈfəʊtəʊ',r:'фотография',e:'🖼️',g:'PH',hint:'PH даёт звук [f]. Ударение на первый слог.'},
{w:'dolphin',t:'ˈdɒlfɪn',r:'дельфин',e:'🐬',g:'PH',hint:'PH в середине слова произносится [f].'},
{w:'elephant',t:'ˈelɪfənt',r:'слон',e:'🐘',g:'PH',hint:'Ударение на первый слог, PH — [f].'}];
let mode='learn',group='SH',muted=false,queue=[],pos=0,score=0,mistakes=new Set(),locked=false,round='main',letters=[],built='';const app=document.querySelector('#app');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
let heard=new Set(),learnSession=0,unlockedGroup=0;
const soundOrder=['SH','CH','TH','PH'];
function updateLearningLocks(){const members=words.filter(w=>w.g===group);let next=members.findIndex(w=>!heard.has(w.w));app.querySelectorAll('[data-say]').forEach(b=>{const i=members.findIndex(w=>w.w===b.dataset.say);b.disabled=i>next&&next!==-1;b.title=b.disabled?'Сначала послушай предыдущее слово':''})}
function completeLearningWord(word,session,currentGroup){if(mode!=='learn'||session!==learnSession||group!==currentGroup)return;heard.add(word);const members=words.filter(w=>w.g===group);if(members.length&&members.every(w=>heard.has(w.w))){const index=soundOrder.indexOf(group);if(index<soundOrder.length-1){unlockedGroup=Math.max(unlockedGroup,index+1);group=soundOrder[index+1];heard.clear();learnSession++;render()}else{mode='meaning';learnSession++;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));start()}}else updateLearningLocks()}

function speak(w,onEnd){if(muted)return;if(!('speechSynthesis'in window)){document.querySelector('#audioNotice')?.remove();app.insertAdjacentHTML('beforeend','<p id="audioNotice">Озвучка недоступна в этом браузере. Используй транскрипцию на карточках.</p>');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=.8;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==='en-GB')||vs.find(v=>v.lang.startsWith('en'))||null;u.onend=()=>{if(onEnd)onEnd()};speechSynthesis.speak(u)}
function marked(w){return w.replace(/sh|ch|th|ph/gi,x=>'<mark>'+x+'</mark>')}
document.querySelector('#sound').onclick=()=>{muted=!muted;if(muted&&effectContext)effectContext.suspend().catch(()=>{});if('speechSynthesis'in window)speechSynthesis.cancel();document.querySelector('#sound').textContent=muted?'🔇 Без звука':'🔊 Звук';document.querySelector('#sound').setAttribute('aria-label',muted?'Включить звук':'Выключить звук')};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;learnSession++;heard.clear();if(mode==='learn'){group='SH';unlockedGroup=0;}document.querySelectorAll('[data-mode]').forEach(n=>n.classList.toggle('active',n===b));if('speechSynthesis'in window)speechSynthesis.cancel();start()});
function start(){queue=shuffle(words);pos=0;score=0;mistakes=new Set();round='main';render()}
function render(){locked=false;if(mode==='learn'){app.innerHTML='<h2>Послушай, повтори и запомни</h2><div class="notes">SH → [ʃ] · CH → [tʃ] · PH → [f]<br>TH → [θ] в three и thumb; [ð] в this.</div><div class="groups">'+soundOrder.map((g,i)=>'<button '+(i>unlockedGroup?'disabled ':'')+'class="'+(g===group?'active':'')+'" data-group="'+g+'">'+g+'</button>').join('')+'</div><div class="cards">'+words.filter(w=>group==='Все'||w.g===group).map(w=>'<article class="card"><div class="icon">'+w.e+'</div><div class="word">'+marked(w.w)+'</div><div class="ipa">['+w.t+']</div><div class="translation">'+w.r+'</div><button data-say="'+w.w+'">🔊 Послушать</button><p class="tip">'+w.hint+'</p></article>').join('')+'</div>';app.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{if(soundOrder.indexOf(b.dataset.group)>unlockedGroup)return;group=b.dataset.group;heard.clear();learnSession++;if('speechSynthesis'in window)speechSynthesis.cancel();render()});app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{if(b.disabled)return;const session=learnSession,currentGroup=group;const word=b.dataset.say;speak(word,()=>completeLearningWord(word,session,currentGroup))});updateLearningLocks();return}if(pos>=queue.length){finish();return}let w=queue[pos];app.innerHTML='<div><small>'+(round==='retry'?'Повторяем трудные слова':'Задание')+' '+(pos+1)+' из '+queue.length+'</small><div class="progress"><div style="width:'+pos/queue.length*100+'%"></div></div></div><div class="question"><h2>'+({meaning:'Найди перевод',listen:'Послушай и выбери слово',spell:'Собери английское слово'})[mode]+'</h2><div id="prompt"></div><div id="choices" class="options"></div><div class="feedback" aria-live="polite" id="feedback"></div><button id="next" hidden class="primary">Дальше</button></div>';document.querySelector('#next').onclick=()=>{pos++;render()};let prompt=document.querySelector('#prompt');if(mode==='meaning'){prompt.innerHTML='<div class="word">'+marked(w.w)+'</div><div class="ipa">['+w.t+']</div><p><button id="say">🔊 Послушать</button></p>';document.querySelector('#say').onclick=()=>speak(w.w);choices(w,'r')}else if(mode==='listen'){prompt.innerHTML='<button class="primary" id="say">🔊 Послушать слово</button><p>Нажми на динамик, затем выбери ответ.</p>';document.querySelector('#say').onclick=()=>speak(w.w);choices(w,'w')}else{prompt.innerHTML='<div class="icon">'+w.e+'</div><div class="translation">'+w.r+'</div><button id="say">🔊 Подсказка: послушать</button><div class="word" id="built">'+ '＿'.repeat(w.w.length)+'</div>';document.querySelector('#say').onclick=()=>speak(w.w);built='';letters=shuffle([...w.w].map((v,i)=>({v,i})));document.querySelector('#choices').innerHTML=letters.map(l=>'<button data-letter="'+l.i+'">'+l.v+'</button>').join('')+'<button id="reset">Сначала</button>';document.querySelector('#reset').onclick=()=>render();app.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{if(locked)return;built+=b.textContent;b.disabled=true;document.querySelector('#built').textContent=built;if(built.length===w.w.length){check(built===w.w);if(built!==w.w){app.querySelectorAll('[data-letter]').forEach(n=>n.disabled=true)}}})}}
function choices(w,key){let opts=shuffle([w,...shuffle(words.filter(x=>x!==w)).slice(0,3)]);document.querySelector('#choices').innerHTML=opts.map(o=>'<button data-answer="'+o.w+'">'+o[key]+'</button>').join('');app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;let ok=b.dataset.answer===w.w;b.classList.add(ok?'good':'bad');if(!ok)app.querySelector('[data-answer="'+w.w+'"]').classList.add('good');check(ok)})}
let effectContext;
function answerSound(ok){
 if(muted)return;
 const AudioEngine=window.AudioContext||window.webkitAudioContext;if(!AudioEngine)return;
 try{effectContext=effectContext||new AudioEngine();if(effectContext.state==='suspended')effectContext.resume().catch(()=>{});
 const ctx=effectContext,t=ctx.currentTime;
 if(ok){[784,1046.5,1318.5].forEach((frequency,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=frequency;const at=t+i*.09;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.16,at+.012);gain.gain.exponentialRampToValueAtTime(.001,at+.32);osc.connect(gain);gain.connect(ctx.destination);osc.start(at);osc.stop(at+.34)})}
 else{[0,.27].forEach((offset,i)=>{const at=t+offset,osc=ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(190-i*15,at);osc.frequency.exponentialRampToValueAtTime(105,at+.22);filter.type='bandpass';filter.frequency.setValueAtTime(1250,at);filter.frequency.exponentialRampToValueAtTime(620,at+.22);filter.Q.value=1.8;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.38,at+.02);gain.gain.setValueAtTime(.28,at+.09);gain.gain.exponentialRampToValueAtTime(.001,at+.24);osc.connect(filter);filter.connect(gain);gain.connect(ctx.destination);osc.start(at);osc.stop(at+.25)})}
 }catch(e){}
}
function check(ok){locked=true;answerSound(ok);let w=queue[pos];if(ok)score++;else mistakes.add(w.w);document.querySelector('#feedback').innerHTML=(ok?'⭐ Верно! ':'Попробуем ещё раз в конце. ')+'<br>'+w.w+' ['+w.t+'] — '+w.r;document.querySelector('#next').hidden=false}
function finish(){const nextMode={meaning:'listen',listen:'spell'}[mode];if(nextMode){mode=nextMode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));start();return}let failed=[...mistakes];app.innerHTML='<div class="question"><div class="icon">'+(failed.length?'🌟':'🏆')+'</div><h2>'+(failed.length?'Хорошая работа!':'Отлично! Все слова пройдены!')+'</h2><p>Верных ответов: <strong>'+score+' из '+queue.length+'</strong></p>'+(failed.length?'<p>Повтори: '+failed.join(', ')+'</p><button class="primary" id="retry">Повторить трудные слова</button>':'<p>Теперь попробуй другое задание.</p>')+'<p><button id="again">Играть ещё раз</button></p><p><button id="restart" class="primary">Начать сначала</button></p></div>';document.querySelector('#again').onclick=start;document.querySelector('#restart').onclick=()=>document.querySelector('[data-mode="learn"]').click();if(failed.length)document.querySelector('#retry').onclick=()=>{queue=shuffle(words.filter(w=>mistakes.has(w.w)));mistakes=new Set();score=0;pos=0;round='retry';render()}}
start();
</script></html>
